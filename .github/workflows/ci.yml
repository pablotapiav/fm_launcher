name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos: este flujo solo lee el código.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      # Las acciones están fijadas por commit (no por etiqueta) para que nadie pueda cambiarlas por debajo.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Sin scripts de instalación de terceros: no hacen falta para probar ni compilar.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
