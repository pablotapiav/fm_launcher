name: Release

# Se publica una versión nueva al subir una etiqueta, por ejemplo:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FM-Launcher-Setup-*.exe
            release/FM-Launcher-*-portable.exe
          generate_release_notes: true
